name: TimeDisplay
options:
  bundleIdPrefix: com.timedisplay
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: TimeDisplay
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  TimeDisplay:
    type: application
    platform: macOS
    sources:
      - path: TimeDisplay
        type: group
    settings:
      base:
        INFOPLIST_FILE: TimeDisplay/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.timedisplay.TimeDisplay
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LSUIElement: YES
    info:
      path: TimeDisplay/Info.plist
      properties:
        CFBundleName: TimeDisplay
        CFBundleDisplayName: TimeDisplay
        CFBundleIdentifier: com.timedisplay.TimeDisplay
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: TimeDisplay
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
